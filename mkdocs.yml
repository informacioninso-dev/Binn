site_name: ERP-B22
site_description: Micro-ERP modular con trazabilidad ISO 13485
site_author: "Tu nombre / equipo"
site_url: ""

theme:
  name: material
  language: es
  features:
    - navigation.instant
    - navigation.sections
    - navigation.tabs
    - content.code.copy
    - content.tabs.link
    - toc.follow
  palette:
    - scheme: default
      primary: blue
      accent: indigo

nav:
  - Inicio: index.md
  - Guía de instalación:
      - Setup del proyecto: setup.md
      - Entorno y Poetry: poetry_env.md
  - Arquitectura:
      - Visión general: architecture.md
      - Inventario: modules/inventory.md
      - Finanzas: modules/finance.md
      - Facturación: modules/billing.md
      - Producción: modules/production.md
  - Flujos de negocio:
      - Recepción de MP: flows/raw_material_reception.md
      - Liberación de lotes (QA): flows/lot_qa_release.md
      - Trazabilidad ISO 13485: flows/traceability_iso13485.md
  - API (futuro):
      - Inventory API: api/inventory_api.md
  - Despliegue:
      - Deployment: deployment.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          setup_commands:
            - import sys
            - sys.path.append(".")

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/tu-org/erp-b22
      name: Código fuente
