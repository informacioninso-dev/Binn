{# templates/partners/_nav.html #}
{% with url_name=request.resolver_match.url_name %}
<nav class="mb-5 -mx-1 overflow-x-auto scrollbar-none">
  <div class="flex gap-2 px-1 py-1 min-w-max">
    <a href="{% url 'partners:index' %}"
       class="whitespace-nowrap rounded-full px-4 py-2 text-sm font-medium transition-colors
       {% if url_name in 'index create update' %}bg-blue-600 text-white shadow-sm{% else %}bg-gray-100 text-gray-700 hover:bg-gray-200{% endif %}">
      Socios
    </a>
  </div>
</nav>
{% endwith %}
