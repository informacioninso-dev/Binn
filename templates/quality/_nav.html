{# templates/quality/_nav.html #}
{% with url_name=request.resolver_match.url_name %}
<nav class="mb-5 -mx-1 overflow-x-auto scrollbar-none">
  <div class="flex gap-2 px-1 py-1 min-w-max">
    <a href="{% url 'quality:pending_lots' %}"
       class="whitespace-nowrap rounded-full px-4 py-2 text-sm font-medium transition-colors
       {% if url_name == 'pending_lots' %}bg-blue-600 text-white shadow-sm{% else %}bg-gray-100 text-gray-700 hover:bg-gray-200{% endif %}">
      QA Pendientes
    </a>
    <a href="{% url 'quality:inspection_list' %}"
       class="whitespace-nowrap rounded-full px-4 py-2 text-sm font-medium transition-colors
       {% if 'inspection' in url_name %}bg-blue-600 text-white shadow-sm{% else %}bg-gray-100 text-gray-700 hover:bg-gray-200{% endif %}">
      Inspecciones
    </a>
    <a href="{% url 'quality:qa_plan_list' %}"
       class="whitespace-nowrap rounded-full px-4 py-2 text-sm font-medium transition-colors
       {% if 'qa_plan' in url_name %}bg-blue-600 text-white shadow-sm{% else %}bg-gray-100 text-gray-700 hover:bg-gray-200{% endif %}">
      Planes QA
    </a>
    <a href="{% url 'quality:receptions_qa_list' %}"
       class="whitespace-nowrap rounded-full px-4 py-2 text-sm font-medium transition-colors
       {% if 'receptions_qa' in url_name %}bg-blue-600 text-white shadow-sm{% else %}bg-gray-100 text-gray-700 hover:bg-gray-200{% endif %}">
      Recepciones QA
    </a>
    <a href="{% url 'quality:audit_home' %}"
       class="whitespace-nowrap rounded-full px-4 py-2 text-sm font-medium transition-colors
       {% if 'audit' in url_name %}bg-blue-600 text-white shadow-sm{% else %}bg-gray-100 text-gray-700 hover:bg-gray-200{% endif %}">
      Auditoría
    </a>
    <a href="{% url 'quality:recall_list' %}"
       class="whitespace-nowrap rounded-full px-4 py-2 text-sm font-medium transition-colors
       {% if 'recall' in url_name %}bg-blue-600 text-white shadow-sm{% else %}bg-gray-100 text-gray-700 hover:bg-gray-200{% endif %}">
      Retiros
    </a>
  </div>
</nav>
{% endwith %}
