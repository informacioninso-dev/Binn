{% extends 'base.html' %}
{% block title %}Contrase&ntilde;a actualizada · Binn{% endblock %}
{% block content %}
<style>
  .binn-password-page { display: grid; place-items: start center; min-height: min(68vh, 46rem); padding: clamp(2rem, 7vh, 5.5rem) 1rem; }
  .binn-password-card { width: min(100%, 34rem); overflow: hidden; border: 1px solid var(--binn-line); border-radius: var(--binn-radius-xl); background: var(--binn-card); box-shadow: var(--binn-shadow); }
  .binn-password-intro { padding: 1.6rem 1.7rem 1.35rem; border-bottom: 1px solid var(--binn-line); background: linear-gradient(135deg, rgba(0, 123, 255, 0.08), rgba(255, 255, 255, 0)); }
  .binn-password-kicker { margin: 0 0 0.45rem; color: var(--binn-accent-deep); font-size: 0.72rem; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; }
  .binn-password-title { margin: 0; color: var(--binn-ink); font-family: var(--binn-font-display); font-size: clamp(1.55rem, 4vw, 2rem); letter-spacing: -0.04em; }
  .binn-password-copy { margin: 0.45rem 0 0; color: var(--binn-ink-soft); font-size: 0.92rem; line-height: 1.5; }
  .binn-password-form { display: grid; gap: 1.15rem; padding: 1.5rem 1.7rem 1.7rem; }
  .binn-password-submit { border: 0; border-radius: 0.8rem; background: var(--binn-accent); color: #fff; padding: 0.75rem 1rem; font-size: 0.86rem; font-weight: 800; box-shadow: 0 10px 20px rgba(0, 123, 255, 0.2); }
</style>
<section class="binn-password-page" aria-labelledby="password-done-title">
  <div class="binn-password-card">
    <header class="binn-password-intro">
      <p class="binn-password-kicker">Seguridad de la cuenta</p>
      <h1 id="password-done-title" class="binn-password-title">Contrase&ntilde;a actualizada</h1>
      <p class="binn-password-copy">Tu nueva contrase&ntilde;a ya esta activa. Puedes continuar trabajando con normalidad.</p>
    </header>
    <div class="binn-password-form"><a href="{% url 'dashboard' %}" class="binn-password-submit" style="text-align:center; text-decoration:none;">Ir al inicio</a></div>
  </div>
</section>
{% endblock %}
