{% extends 'base.html' %}
{% block title %}Cambiar contraseña · Panel{% endblock %}
{% block content %}
<div class="min-h-[60vh] grid place-items-center">
  <div class="w-full max-w-md rounded-2xl border bg-white p-6 shadow-sm">
    <h1 class="mb-4 text-2xl font-bold text-center">Cambiar contraseña</h1>
    <form method="post" class="space-y-4">
      {% csrf_token %}
      {{ form.non_field_errors }}
      <div>
        <label class="mb-1 block text-sm font-medium" for="id_old_password">Contraseña actual</label>
        {{ form.old_password }}
      </div>
      <div>
        <label class="mb-1 block text-sm font-medium" for="id_new_password1">Nueva contraseña</label>
        {{ form.new_password1 }}
      </div>
      <div>
        <label class="mb-1 block text-sm font-medium" for="id_new_password2">Confirmar nueva contraseña</label>
        {{ form.new_password2 }}
      </div>
      <button class="w-full rounded-lg bg-blue-600 px-4 py-2 text-sm font-medium text-white hover:bg-blue-700">Guardar</button>
    </form>
    <p class="mt-4 text-center text-xs text-gray-500">
      <a class="underline" href="{% url 'dashboard' %}">Volver al panel</a>
    </p>
  </div>
</div>
{% endblock %}
