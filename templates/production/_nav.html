{# templates/production/_nav.html #}
{% with url_name=request.resolver_match.url_name %}
<nav class="mb-5 -mx-1 overflow-x-auto scrollbar-none">
  <div class="flex gap-2 px-1 py-1 min-w-max">
    <a href="{% url 'production:operations_list' %}"
       class="whitespace-nowrap rounded-full px-4 py-2 text-sm font-medium transition-colors
       {% if 'operation' in url_name %}bg-blue-600 text-white shadow-sm{% else %}bg-gray-100 text-gray-700 hover:bg-gray-200{% endif %}">
      Operaciones
    </a>
    <a href="{% url 'production:plans_list' %}"
       class="whitespace-nowrap rounded-full px-4 py-2 text-sm font-medium transition-colors
       {% if 'plans' in url_name %}bg-blue-600 text-white shadow-sm{% else %}bg-gray-100 text-gray-700 hover:bg-gray-200{% endif %}">
      Planes
    </a>
    <a href="{% url 'production:orders_list' %}"
       class="whitespace-nowrap rounded-full px-4 py-2 text-sm font-medium transition-colors
       {% if 'order' in url_name %}bg-blue-600 text-white shadow-sm{% else %}bg-gray-100 text-gray-700 hover:bg-gray-200{% endif %}">
      Órdenes
    </a>

    {# Dropdown Configuraciones #}
    <div class="relative" id="prod-config-dropdown">
      <button onclick="document.getElementById('prod-config-menu').classList.toggle('hidden')" type="button"
         class="whitespace-nowrap rounded-full px-4 py-2 text-sm font-medium transition-colors inline-flex items-center gap-1
         {% if 'bom' in url_name or 'route' in url_name or 'workcenter' in url_name %}bg-blue-600 text-white shadow-sm{% else %}bg-gray-100 text-gray-700 hover:bg-gray-200{% endif %}">
        Configuraciones
        <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M19 9l-7 7-7-7"/></svg>
      </button>
      <div id="prod-config-menu" class="hidden absolute left-0 z-20 mt-1 w-48 rounded-xl border bg-white py-1 shadow-lg">
        <a href="{% url 'production:bom_list' %}"
           class="block px-4 py-2 text-sm {% if 'bom' in url_name %}text-blue-600 font-semibold bg-blue-50{% else %}text-gray-700 hover:bg-gray-50{% endif %}">
          Lista de materiales
        </a>
        <a href="{% url 'production:routes_list' %}"
           class="block px-4 py-2 text-sm {% if 'route' in url_name %}text-blue-600 font-semibold bg-blue-50{% else %}text-gray-700 hover:bg-gray-50{% endif %}">
          Rutas
        </a>
        <a href="{% url 'production:workcenters_list' %}"
           class="block px-4 py-2 text-sm {% if 'workcenter' in url_name %}text-blue-600 font-semibold bg-blue-50{% else %}text-gray-700 hover:bg-gray-50{% endif %}">
          Estaciones
        </a>
      </div>
    </div>
  </div>
</nav>
<script>
document.addEventListener('click', function(e) {
  var dd = document.getElementById('prod-config-dropdown');
  var menu = document.getElementById('prod-config-menu');
  if (dd && menu && !dd.contains(e.target)) {
    menu.classList.add('hidden');
  }
});
</script>
{% endwith %}
