{# templates/procurement/_nav.html #}
{% with url_name=request.resolver_match.url_name %}
<nav class="mb-5 -mx-1 overflow-x-auto scrollbar-none">
  <div class="flex gap-2 px-1 py-1 min-w-max">
    <a href="{% url 'procurement:order_list' %}"
       class="whitespace-nowrap rounded-full px-4 py-2 text-sm font-medium transition-colors
       {% if url_name in 'order_list order_create order_update' %}bg-blue-600 text-white shadow-sm{% else %}bg-gray-100 text-gray-700 hover:bg-gray-200{% endif %}">
      Órdenes de compra
    </a>
    <a href="{% url 'procurement:receptions_list' %}"
       class="whitespace-nowrap rounded-full px-4 py-2 text-sm font-medium transition-colors
       {% if 'receptions' in url_name %}bg-blue-600 text-white shadow-sm{% else %}bg-gray-100 text-gray-700 hover:bg-gray-200{% endif %}">
      Recepciones MP
    </a>
  </div>
</nav>
{% endwith %}
