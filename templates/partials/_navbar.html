{% load static %}
<header class="bg-white/90 backdrop-blur border-b">
  <div class="container mx-auto max-w-7xl px-4 py-3 flex items-center justify-between">
    <a href="{% url 'dashboard' %}" class="flex items-center gap-3">
      <img src="{% static 'img/logo.png' %}" alt="Logo" class="h-8 w-8" />
      <span class="font-semibold">MediEcua 360</span>
    </a>

    <nav class="flex items-center gap-4">
      {% if request.user.is_authenticated %}
        {% if request.tenant.schema_name == 'public' %}
          <a href="{% url 'dashboard' %}" class="text-sm text-gray-700 hover:underline">Mis clínicas</a>
          {% if request.user.is_superuser %}
            <a href="{% url 'tenants:list' %}" class="text-sm text-gray-700 hover:underline">Tenants</a>
          {% endif %}
        {% else %}
          <a href="{% url 'dashboard' %}" class="text-sm text-gray-700 hover:underline">Inicio</a>
          <a href="{% url 'patients:index' %}" class="text-sm text-gray-700 hover:underline">Pacientes</a>
          <a href="{% url 'appointments:index' %}" class="text-sm text-gray-700 hover:underline">Citas</a>
        {% endif %}
        <form method="post" action="{% url 'logout' %}" class="inline">
          {% csrf_token %}
          <button type="submit" class="text-sm text-red-600 hover:underline">Salir</button>
        </form>
      {% else %}
        <a href="{% url 'login' %}" class="text-sm text-blue-600 hover:underline">Iniciar sesión</a>
      {% endif %}
    </nav>
  </div>
</header>
