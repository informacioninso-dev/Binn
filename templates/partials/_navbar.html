{% load static %}
<header class="bg-white/80 backdrop-blur border-b">
  <div class="container mx-auto max-w-7xl px-4 py-3 flex items-center justify-between">
    <a href="{% url 'dashboard' %}" class="flex items-center gap-3">
      <img src="{% static 'img/logo.png' %}" alt="Logo" class="h-8 w-8" />
      <span class="font-semibold">Sistema ERP</span>
    </a>

    <nav class="hidden md:flex items-center gap-6">
      {% if request.user.is_authenticated %}
        <a href="{% url 'dashboard' %}" class="hover:text-blue-600">Dashboard</a>
        <a href="{% url 'inventory:index' %}" class="hover:text-blue-600">Inventario</a>
        <a href="{% url 'finance:index' %}" class="hover:text-blue-600">Finanzas</a>
        <a href="{% url 'billing:index' %}" class="hover:text-blue-600">Facturación</a>
        <a href="{% url 'production:index' %}" class="hover:text-blue-600">Producción</a>

        <span class="text-sm text-gray-600">Hola, {{ request.user.get_username }}</span>
        <a href="{% url 'password_change' %}" class="text-sm hover:underline">Cambiar contraseña</a>
        <form method="post" action="{% url 'logout' %}" class="inline">
         {% csrf_token %}
          <button type="submit" class="text-sm text-red-600 hover:underline">
          Salir
        </button>
          </form>
      {% else %}
        <a href="{% url 'login' %}" class="text-sm text-blue-600 hover:underline">Iniciar sesión</a>
      {% endif %}
    </nav>
  </div>
</header>
