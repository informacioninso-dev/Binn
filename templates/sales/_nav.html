{# templates/sales/_nav.html #}
{% with url_name=request.resolver_match.url_name %}
<nav class="mb-5 -mx-1 overflow-x-auto scrollbar-none">
  <div class="flex gap-2 px-1 py-1 min-w-max">
    <a href="{% url 'sales:order_list' %}"
       class="whitespace-nowrap rounded-full px-4 py-2 text-sm font-medium transition-colors
       {% if url_name == 'order_list' or url_name == 'order_detail' or url_name == 'order_create' or url_name == 'dispatch_check' %}bg-blue-600 text-white shadow-sm{% else %}bg-gray-100 text-gray-700 hover:bg-gray-200{% endif %}">
      Pedidos
    </a>
    <a href="{% url 'sales:picking_list' %}"
       class="whitespace-nowrap rounded-full px-4 py-2 text-sm font-medium transition-colors
       {% if url_name == 'picking_list' or url_name == 'picking_detail' %}bg-blue-600 text-white shadow-sm{% else %}bg-gray-100 text-gray-700 hover:bg-gray-200{% endif %}">
      Picking
    </a>
    <a href="{% url 'sales:dispatch_list' %}"
       class="whitespace-nowrap rounded-full px-4 py-2 text-sm font-medium transition-colors
       {% if url_name == 'dispatch_list' or url_name == 'dispatch_confirm' or url_name == 'packing_detail' %}bg-blue-600 text-white shadow-sm{% else %}bg-gray-100 text-gray-700 hover:bg-gray-200{% endif %}">
      Despachos
    </a>
    <a href="{% url 'sales:guia_list' %}"
       class="whitespace-nowrap rounded-full px-4 py-2 text-sm font-medium transition-colors
       {% if url_name == 'guia_list' or url_name == 'guia_detail' or url_name == 'guia_create' %}bg-blue-600 text-white shadow-sm{% else %}bg-gray-100 text-gray-700 hover:bg-gray-200{% endif %}">
      Guías
    </a>
    <a href="{% url 'sales:invoice_list' %}"
       class="whitespace-nowrap rounded-full px-4 py-2 text-sm font-medium transition-colors
       {% if url_name == 'invoice_list' or url_name == 'invoice_detail' %}bg-blue-600 text-white shadow-sm{% else %}bg-gray-100 text-gray-700 hover:bg-gray-200{% endif %}">
      Facturas
    </a>
    <a href="{% url 'sales:return_list' %}"
       class="whitespace-nowrap rounded-full px-4 py-2 text-sm font-medium transition-colors
       {% if url_name == 'return_list' or url_name == 'return_detail' or url_name == 'return_create' %}bg-blue-600 text-white shadow-sm{% else %}bg-gray-100 text-gray-700 hover:bg-gray-200{% endif %}">
      Devoluciones
    </a>
    <a href="{% url 'sales:credit_note_list' %}"
       class="whitespace-nowrap rounded-full px-4 py-2 text-sm font-medium transition-colors
       {% if url_name == 'credit_note_list' %}bg-blue-600 text-white shadow-sm{% else %}bg-gray-100 text-gray-700 hover:bg-gray-200{% endif %}">
      NC
    </a>
  </div>
</nav>
{% endwith %}
